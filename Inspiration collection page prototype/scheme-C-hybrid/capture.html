<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#faf7f0">
<title>记录灵感 · Hybrid Edition · C</title>
<style>
:root {
  --canvas: #faf7f0;
  --surface: #fffefa;
  --surface-2: #f4efe5;
  --ink: #2a2622;
  --ink-2: #4a463f;
  --ink-muted: #807a6e;
  --line: rgba(42, 38, 34, .12);
  --line-soft: rgba(42, 38, 34, .06);
  --accent-teal: #4a6b80;
  --accent-violet: #6c63a3;
  --accent-rose: #c08575;
  --accent-moss: #6b8266;
  --accent-amber: #c8956c;
  --focus: #4a6b80;
  --success: #4f7f62;
  --danger: #b84a4a;
  --radius-panel: 24px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --shadow-soft: 0 1px 2px rgba(42, 38, 34, .04), 0 6px 20px -8px rgba(42, 38, 34, .10);
  --shadow-lift: 0 2px 4px rgba(42, 38, 34, .06), 0 16px 40px -16px rgba(42, 38, 34, .20);
  --ease: cubic-bezier(.2,.7,.3,1);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 16px; line-height: 1.7;
  color: var(--ink); background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font: inherit; color: inherit; }

.bg {
  position: fixed; inset: 0; z-index: -1;
  background: var(--canvas);
}
.bg::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(42,38,34,.04) 1px, transparent 0);
  background-size: 24px 24px;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
  opacity: .8;
}

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  background: rgba(250, 247, 240, .85);
  backdrop-filter: saturate(140%) blur(12px);
  -webkit-backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.back {
  display: flex; align-items: center; gap: 6px;
  color: var(--ink-muted);
  font-size: 14px; padding: 6px 12px;
  border-radius: var(--radius-pill);
  transition: all .2s var(--ease);
}
.back:hover { color: var(--ink); background: var(--surface-2); }
.topbar-title {
  font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
  font-size: 18px; letter-spacing: 1.5px;
  position: relative;
}
.topbar-title::after {
  content: "";
  position: absolute; left: 50%; bottom: -8px;
  transform: translateX(-50%);
  width: 24px; height: 1px;
  background: var(--accent-teal);
}
.status-line {
  display: flex; align-items: center; gap: 12px;
  font-size: 12px; color: var(--ink-muted);
  letter-spacing: .5px;
}
.status-line .save-bar {
  width: 60px; height: 2px;
  background: var(--line); border-radius: 1px;
  overflow: hidden;
  position: relative;
}
.status-line .save-bar::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 0; background: var(--success);
  transition: width .4s var(--ease);
}
.status-line.saving .save-bar::after { width: 60%; background: var(--accent-amber); animation: barMove 1.2s infinite; }
.status-line.saved .save-bar::after { width: 100%; }
@keyframes barMove {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}

/* ---------- 主体 ---------- */
.main {
  max-width: 760px; margin: 0 auto;
  padding: 32px 24px 160px;
}
.date-stamp {
  font-size: 12px; color: var(--ink-muted);
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
  letter-spacing: 1.5px; text-transform: uppercase;
}
.date-stamp::before {
  content: ""; width: 24px; height: 1px; background: var(--accent-teal);
}

/* ---------- 编辑器：白纸质感 ---------- */
.editor {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  padding: 40px;
  min-height: 360px;
  position: relative;
  box-shadow: var(--shadow-soft);
  transition: box-shadow .25s var(--ease), border-color .25s var(--ease);
  background-image:
    linear-gradient(to right, transparent 39px, rgba(192, 133, 117, .06) 39px, rgba(192, 133, 117, .06) 40px, transparent 40px);
  background-position: 0 0;
  background-size: 100% 28px;
}
.editor:focus-within {
  border-color: var(--accent-teal);
  box-shadow: 0 0 0 1px var(--accent-teal), 0 8px 32px -8px rgba(74, 107, 128, .15), var(--shadow-soft);
}
.editor::after {
  content: ""; position: absolute;
  top: 0; left: 40px; bottom: 0;
  width: 1px;
  background: rgba(192, 133, 117, .25);
  pointer-events: none;
}

.title-input {
  width: 100%; border: 0; outline: 0; background: transparent;
  font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
  font-size: 30px; line-height: 1.4;
  font-weight: 500;
  color: var(--ink);
  padding: 0 0 0 56px;
  margin-bottom: 16px;
  letter-spacing: 1px;
}
.title-input::placeholder { color: rgba(42, 38, 34, .25); }

.body-input {
  width: 100%; border: 0; outline: 0; background: transparent;
  font-size: 16px; line-height: 1.85;
  color: var(--ink);
  resize: none; min-height: 200px;
  padding: 0 0 0 56px;
}
.body-input::placeholder { color: rgba(42, 38, 34, .32); }

/* 统计 */
.editor-stats {
  position: absolute; bottom: 16px; right: 24px;
  display: flex; gap: 12px;
  font-size: 11px; color: var(--ink-muted);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}

/* ---------- 附件区 ---------- */
.attachments {
  margin-top: 24px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.attach {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--radius-card);
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--surface-2);
  transition: all .2s var(--ease);
}
.attach:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.attach img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attach.audio {
  aspect-ratio: auto;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(135deg, rgba(108, 99, 163, .08), rgba(74, 107, 128, .05));
  border-color: rgba(108, 99, 163, .2);
}
.attach.audio .wave { flex: 1; display: flex; align-items: center; gap: 2px; min-height: 32px; }
.attach.audio .wave i {
  flex: 1; height: 100%; border-radius: 1px;
  background: var(--accent-violet); opacity: .55;
}
.attach.audio .meta { font-size: 12px; color: var(--ink-muted); display: flex; justify-content: space-between; }
.attach .x {
  position: absolute; top: 6px; right: 6px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(42,38,34,.7); color: white;
  display: grid; place-items: center; font-size: 12px;
  border: 0; cursor: pointer;
  opacity: 0; transition: opacity .2s var(--ease);
}
.attach:hover .x { opacity: 1; }

.attach.processing::after {
  content: ""; position: absolute; inset: 0;
  background: rgba(255, 254, 250, .7);
  background-image: linear-gradient(90deg, transparent 0%, rgba(108, 99, 163, .15) 50%, transparent 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius-card);
}
@keyframes shimmer {
  from { background-position: 200% 0; }
  to   { background-position: -200% 0; }
}

/* ---------- 工具栏：底部毛笔感 ---------- */
.toolbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
  background: rgba(250, 247, 240, .92);
  backdrop-filter: saturate(140%) blur(14px);
  -webkit-backdrop-filter: saturate(140%) blur(14px);
  border-top: 1px solid var(--line);
  padding: 12px 24px max(12px, env(safe-area-inset-bottom));
}
.toolbar-inner {
  max-width: 760px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.tool-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border-radius: var(--radius-pill);
  color: var(--ink-muted);
  font-size: 14px;
  transition: all .2s var(--ease);
  border: 1px solid transparent;
}
.tool-btn:hover { color: var(--ink); background: var(--surface); border-color: var(--line); }
.tool-btn .ico { font-size: 16px; }
.tool-btn .label { display: none; }
@media (min-width: 720px) { .tool-btn .label { display: inline; } }
.tool-btn.disabled { opacity: .35; cursor: not-allowed; }
.tool-btn.disabled:hover { color: var(--ink-muted); background: transparent; border-color: transparent; }

/* 类型选择器 */
.type-select { position: relative; margin-left: auto; }
.type-trigger {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  transition: all .2s var(--ease);
}
.type-trigger:hover {
  border-color: var(--accent-teal);
  box-shadow: 0 0 0 3px rgba(74, 107, 128, .12);
}
.type-trigger .swatch {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink-muted);
  position: relative;
}
.type-trigger .swatch::after {
  content: ""; position: absolute; inset: -3px;
  border-radius: 50%;
  border: 1px solid currentColor;
  opacity: .3;
}
.type-trigger[data-type="想法"] .swatch { background: var(--accent-violet); color: var(--accent-violet); }
.type-trigger[data-type="引用"] .swatch { background: var(--accent-teal);   color: var(--accent-teal); }
.type-trigger[data-type="随感"] .swatch { background: var(--accent-rose);   color: var(--accent-rose); }
.type-trigger[data-type="待办"] .swatch { background: var(--accent-moss);   color: var(--accent-moss); }
.type-trigger[data-type="案例"] .swatch { background: var(--accent-amber);  color: var(--accent-amber); }
.type-trigger[data-type="问题"] .swatch { background: var(--danger);        color: var(--danger); }
.type-trigger .caret { color: var(--ink-muted); font-size: 10px; }

.type-menu {
  position: absolute; bottom: calc(100% + 8px); right: 0;
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 6px;
  box-shadow: var(--shadow-lift);
  display: none;
  z-index: 12;
}
.type-menu.open { display: block; animation: rise .18s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.type-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 8px 10px;
  border-radius: 8px;
  color: var(--ink);
  font-size: 14px;
  transition: background .15s var(--ease);
}
.type-item:hover { background: var(--surface-2); }
.type-item .swatch {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink-muted);
}
.type-item[data-type="想法"] .swatch { background: var(--accent-violet); }
.type-item[data-type="引用"] .swatch { background: var(--accent-teal); }
.type-item[data-type="随感"] .swatch { background: var(--accent-rose); }
.type-item[data-type="待办"] .swatch { background: var(--accent-moss); }
.type-item[data-type="案例"] .swatch { background: var(--accent-amber); }
.type-item[data-type="问题"] .swatch { background: var(--danger); }

/* 主操作按钮：毛笔笔触 */
.primary {
  padding: 10px 20px;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--canvas);
  font-size: 14px; font-weight: 500;
  transition: all .25s var(--ease);
  border: 0;
  display: inline-flex; align-items: center; gap: 6px;
  position: relative;
  overflow: hidden;
}
.primary::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent, rgba(255,255,255,.1));
  opacity: 0; transition: opacity .2s var(--ease);
}
.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(42,38,34,.5); }
.primary:hover::before { opacity: 1; }

/* AI 建议：批注风格 */
.ai-suggest {
  display: flex; align-items: center; gap: 12px;
  margin-top: 20px;
  padding: 12px 16px;
  background: linear-gradient(to right, rgba(108, 99, 163, .08), transparent);
  border-left: 3px solid var(--accent-violet);
  border-radius: 4px var(--radius-card) var(--radius-card) 4px;
  font-size: 13px; color: var(--ink-2);
  animation: rise .3s var(--ease);
}
.ai-suggest .badge {
  font-size: 10px; padding: 2px 8px; border-radius: 4px;
  background: var(--accent-violet); color: white;
  letter-spacing: 1px; font-weight: 500;
  text-transform: uppercase;
}
.ai-suggest button {
  margin-left: auto;
  color: var(--accent-violet);
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 4px;
}
.ai-suggest button:hover { background: rgba(108, 99, 163, .1); }

/* 拖拽提示 */
.dropzone-hint {
  margin-top: 16px;
  text-align: center;
  font-size: 12px; color: var(--ink-muted);
  padding: 12px;
  border: 1px dashed var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
}

/* 入场动效 */
.reveal { opacity: 0; transform: translateY(8px); animation: reveal .5s var(--ease) forwards; }
.reveal.d1 { animation-delay: .05s; }
.reveal.d2 { animation-delay: .15s; }
@keyframes reveal { to { opacity: 1; transform: none; } }

/* 响应式 */
@media (max-width: 720px) {
  .main { padding: 20px 16px 180px; }
  .editor { padding: 24px 20px; }
  .editor::after { display: none; }
  .title-input, .body-input { padding-left: 0; }
  .title-input { font-size: 24px; }
  .editor-stats { display: none; }
  .toolbar-inner { gap: 8px; }
  .primary { padding: 10px 14px; }
  .type-select { margin-left: 0; flex: 1; }
  .type-trigger { width: 100%; justify-content: center; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
.attach:focus-visible,
.tool-btn:focus-visible,
.primary:focus-visible,
.back:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="topbar">
  <a href="./home.html" class="back" aria-label="返回工作台">← 返回</a>
  <div class="topbar-title">记录灵感</div>
  <div class="status-line saved" id="statusLine">
    <span>已保存</span>
    <span class="save-bar" aria-hidden="true"></span>
    <span>17:42</span>
  </div>
</header>

<main class="main">

  <p class="date-stamp reveal">2026 / 08 / 18 · 周二 · 17:42</p>

  <form class="editor reveal d1" id="editorForm" autocomplete="off">
    <input
      class="title-input"
      type="text"
      placeholder="标题（可留空）"
      aria-label="标题"
    >

    <textarea
      class="body-input"
      placeholder="写下此刻的想法……

不必完整，先抓住那束光。
粘贴图片、拖入文件、随时切换灵感类型。"
      aria-label="正文"
      autofocus
    ></textarea>

    <div class="editor-stats" id="stats">
      <span><strong id="wordCount">0</strong> 字</span>
      <span>·</span>
      <span><strong id="attachCount">3</strong> 个附件</span>
      <span>·</span>
      <span>阅读 ≈ 1 分钟</span>
    </div>

    <div class="attachments" id="attachments">
      <div class="attach" aria-label="附件：草图.jpg">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%23e2d6bd'/><path d='M40,140 Q70,80 100,110 T160,90' stroke='%236c63a3' stroke-width='2' fill='none'/><text x='100' y='180' text-anchor='middle' fill='%236c63a3' font-family='serif' font-size='14' font-style='italic'>草图</text></svg>" alt="">
        <button class="x" type="button" aria-label="移除附件">×</button>
      </div>
      <div class="attach audio" aria-label="音频：01:24">
        <div class="wave" aria-hidden="true">
          <i style="height:30%"></i><i style="height:60%"></i><i style="height:80%"></i>
          <i style="height:50%"></i><i style="height:90%"></i><i style="height:40%"></i>
          <i style="height:70%"></i><i style="height:55%"></i><i style="height:85%"></i>
          <i style="height:35%"></i><i style="height:65%"></i><i style="height:75%"></i>
        </div>
        <div class="meta"><span>🎙 语音</span><span>01:24</span></div>
        <button class="x" type="button" aria-label="移除附件">×</button>
      </div>
      <div class="attach processing" aria-label="处理中">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%23dde2e6'/><text x='100' y='105' text-anchor='middle' fill='%234a6b80' font-family='sans-serif' font-size='13'>识别中…</text></svg>" alt="">
      </div>
    </div>

    <div class="ai-suggest" id="aiSuggest" style="display:none">
      <span class="badge">AI</span>
      <span>看起来像 <strong id="aiType">「想法」</strong>，要切换吗？</span>
      <button type="button" id="aiAccept">接受</button>
    </div>
  </form>

  <div class="dropzone-hint reveal d2">
    提示：可直接粘贴图片、拖拽文件到上方；移动端后续支持拍照与录音。
  </div>

</main>

<div class="toolbar" role="toolbar" aria-label="记录工具栏">
  <div class="toolbar-inner">
    <button class="tool-btn" type="button" data-action="image">
      <span class="ico">🖼</span><span class="label">图片</span>
    </button>
    <button class="tool-btn" type="button" data-action="audio">
      <span class="ico">🎙</span><span class="label">音频</span>
    </button>
    <button class="tool-btn disabled" type="button" aria-label="拍照（移动端）" title="移动端后续支持">
      <span class="ico">📷</span><span class="label">拍照</span>
    </button>
    <button class="tool-btn disabled" type="button" aria-label="录音（移动端）" title="移动端后续支持">
      <span class="ico">🎤</span><span class="label">录音</span>
    </button>

    <div class="type-select">
      <button class="type-trigger" type="button" id="typeTrigger" data-type="想法" aria-haspopup="listbox" aria-expanded="false">
        <span class="swatch" aria-hidden="true"></span>
        <span id="typeLabel">想法</span>
        <span class="caret">▾</span>
      </button>
      <div class="type-menu" id="typeMenu" role="listbox">
        <button class="type-item" type="button" data-type="先不分类">
          <span class="swatch" style="background: var(--ink-muted)"></span>先不分类
        </button>
        <button class="type-item" type="button" data-type="想法">
          <span class="swatch"></span>想法
        </button>
        <button class="type-item" type="button" data-type="引用">
          <span class="swatch"></span>引用
        </button>
        <button class="type-item" type="button" data-type="随感">
          <span class="swatch"></span>随感
        </button>
        <button class="type-item" type="button" data-type="待办">
          <span class="swatch"></span>待办
        </button>
        <button class="type-item" type="button" data-type="案例">
          <span class="swatch"></span>案例
        </button>
        <button class="type-item" type="button" data-type="问题">
          <span class="swatch"></span>问题
        </button>
      </div>
    </div>

    <button class="primary" type="submit" form="editorForm">保存 <span aria-hidden="true">⌘↵</span></button>
  </div>
</div>

<script>
const trigger = document.getElementById('typeTrigger');
const menu = document.getElementById('typeMenu');
const label = document.getElementById('typeLabel');
const items = menu.querySelectorAll('.type-item');
const aiSuggest = document.getElementById('aiSuggest');
const aiType = document.getElementById('aiType');
const aiAccept = document.getElementById('aiAccept');

trigger.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = menu.classList.toggle('open');
  trigger.setAttribute('aria-expanded', isOpen);
});
document.addEventListener('click', () => {
  menu.classList.remove('open');
  trigger.setAttribute('aria-expanded', 'false');
});
items.forEach(item => {
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    const t = item.dataset.type;
    trigger.dataset.type = t;
    label.textContent = t;
    menu.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
    aiSuggest.style.display = 'none';
  });
});

setTimeout(() => {
  if (!aiSuggest.style.display || aiSuggest.style.display === 'none') {
    aiSuggest.style.display = 'flex';
    aiType.textContent = '「引用」';
  }
}, 3000);

aiAccept.addEventListener('click', () => {
  trigger.dataset.type = '引用';
  label.textContent = '引用';
  aiSuggest.style.display = 'none';
});

// 自动保存状态
const line = document.getElementById('statusLine');
const body = document.querySelector('.body-input');
const wordCount = document.getElementById('wordCount');
let saveTimer = null;
body.addEventListener('input', () => {
  line.classList.remove('saved');
  line.classList.add('saving');
  line.querySelector('span').textContent = '正在保存…';
  const count = body.value.length;
  wordCount.textContent = count;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    line.classList.remove('saving');
    line.classList.add('saved');
    const d = new Date();
    line.querySelector('span').textContent = '已保存';
    line.lastElementChild.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }, 800);
});

document.getElementById('editorForm').addEventListener('submit', (e) => {
  e.preventDefault();
  line.classList.remove('saving');
  line.classList.add('saved');
  line.querySelector('span').textContent = '已记录 ✓';
  // 反馈：主按钮短暂高亮
  const btn = document.querySelector('.primary');
  btn.style.transform = 'scale(1.05)';
  setTimeout(() => btn.style.transform = '', 200);
});
</script>
</body>
</html>
